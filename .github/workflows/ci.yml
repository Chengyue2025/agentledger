name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Windows runner 默认 shell 是 pwsh，不支持 heredoc；统一 bash（Git Bash）保证三平台一致
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # 刻意不加 pip install：项目必须保持零运行时依赖。
      # 这里验证的是"零依赖"这条设计原则本身没被破坏。
      - name: Assert zero runtime dependencies
        run: |
          python -c "import tomllib,sys
          d=tomllib.load(open('pyproject.toml','rb'))
          deps=d['project'].get('dependencies',[])
          assert deps==[], f'runtime deps must stay empty, got {deps}'
          print('zero-dependency constraint OK')"

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Scan fixtures — vulnerable must be caught
        run: |
          python -m agentledger scan fixtures/vulnerable --no-ledger -o /tmp/al-vuln || true
          python - <<'PY'
          import json, glob, sys
          f = sorted(glob.glob('/tmp/al-vuln/pack-*.json'))[-1]
          d = json.load(open(f, encoding='utf-8'))
          ids = {x['rule_id'] for x in d['findings']}
          required = {'MCP002','MCP003','PRM002','DEP002','AGT002'}
          missing = required - ids
          assert not missing, f'fixture must trigger {missing}'
          assert d['summary']['by_severity']['CRITICAL'] > 0
          print('vulnerable fixture OK:', len(d['findings']), 'findings')
          PY

      - name: Scan fixtures — compliant must be silent
        run: |
          python -m agentledger scan fixtures/clean --no-ledger -o /tmp/al-clean
          python - <<'PY'
          import json, glob
          f = sorted(glob.glob('/tmp/al-clean/pack-*.json'))[-1]
          d = json.load(open(f, encoding='utf-8'))
          assert d['summary']['total_findings'] == 0, \
              f'compliant baseline must be silent, got {d["findings"]}'
          print('compliant fixture OK: 0 false positives')
          PY

      - name: Verify ledger tamper detection
        run: |
          python -m agentledger scan fixtures/vulnerable --no-ledger -o /tmp/al-led >/dev/null 2>&1 || true
          python -m agentledger scan fixtures/vulnerable -o /tmp/al-led >/dev/null 2>&1 || true
          python -m agentledger scan fixtures/vulnerable -o /tmp/al-led >/dev/null 2>&1 || true
          python -m agentledger verify fixtures/vulnerable
          python - <<'PY'
          import json, pathlib, subprocess, sys
          p = pathlib.Path('fixtures/vulnerable/.agentledger/ledger.jsonl')
          lines = p.read_text(encoding='utf-8').splitlines()
          d = json.loads(lines[0]); d['findings'] = 0
          lines[0] = json.dumps(d, sort_keys=True, separators=(',',':'), ensure_ascii=False)
          p.write_text('\n'.join(lines)+'\n', encoding='utf-8')
          r = subprocess.run([sys.executable,'-m','agentledger','verify',
                              'fixtures/vulnerable'], capture_output=True, text=True)
          assert r.returncode == 1, 'tampering must be detected'
          assert '断裂' in r.stdout or '✘' in r.stdout or 'X' in r.stdout, r.stdout
          print('tamper detection OK')
          PY

      - name: SARIF must be well-formed
        run: |
          python -m agentledger scan fixtures/vulnerable --sarif --no-ledger -o /tmp/al-sarif >/dev/null 2>&1 || true
          python - <<'PY'
          import json, glob
          f = sorted(glob.glob('/tmp/al-sarif/scan-*.sarif'))[-1]
          d = json.load(open(f, encoding='utf-8'))
          assert d['version'] == '2.1.0'
          run = d['runs'][0]
          ids = {x['id'] for x in run['tool']['driver']['rules']}
          dangling = {x['ruleId'] for x in run['results']} - ids
          assert not dangling, dangling
          print('SARIF OK:', len(run['results']), 'results')
          PY

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build + verify wheel contains no deps
        run: |
          python -m pip install --upgrade build
          python -m build
          python -m pip install dist/*.whl --no-deps -q
          aledger --version
          aledger rules | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/