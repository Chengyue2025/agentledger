[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentledger"
version = "0.1.0"
description = "AI BOM + supply-chain provenance + tamper-evident accountability ledger for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# 零运行时依赖 —— 刻意为之：合规工具不能有供应链尾巴
dependencies = []

[project.scripts]
aledger = "agentledger.cli:main"

[tool.setuptools.packages.find]
include = ["agentledger*"]